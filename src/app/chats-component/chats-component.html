<div class="chat-layout" [class.mobile-chat-open]="selectedChatId()">
  <!-- 🧭 PANEL IZQUIERDO -->
  <aside class="contacts-panel">
    <h2 class="panel-title">Lista de Contactos</h2>

    <app-search-bar (searchChange)="onSearchChange($event)"></app-search-bar>

    <ul class="contacts-list">
      @for (chat of filteredChats(); track chat.id) {
      <li
        class="contact-item"
        (click)="open(chat.id)"
        [class.active]="chat.id === selectedChatId()"
      >
        <img class="contact-avatar" [src]="chat.image || 'assets/foto1.jpeg'" />

        <div class="contact-info">
          <div class="contact-name">{{ chat.name }}</div>
          <!-- <div class="contact-last">{{ chat.lastMessage || '-' }}</div> -->
        </div>

        <button class="contact-delete" (click)="$event.stopPropagation(); deleteChat(chat.id)">
          Eliminar contacto
        </button>
      </li>
      }
    </ul>

    <app-add-new-contact (addNewContact)="onAddChat($event)"></app-add-new-contact>
  </aside>

  <!-- 💬 PANEL DERECHO -->
  <section class="messages-panel">
    <ng-container *ngIf="selectedChat(); else emptyChat">
      <header class="messages-header">
        <button class="back-btn" (click)="selectedChatId.set(null)">⬅ Volver a Contactos</button>
        <img
          class="header-avatar"
          [src]="selectedChat()?.image || 'assets/foto1.jpeg'"
          alt="Avatar"
        />

        <span class="header-name">
          {{ selectedChat()?.name }}
        </span>
      </header>

      <!-- <div class="messages-body">
        <div *ngFor="let msg of selectedChat()?.messages" class="message" [class.me]="msg.fromMe">
          {{ msg.text }}
        </div>
      </div> -->
      <div class="messages-body">
        <app-messages-list
          [messages]="selectedChat()?.messages ?? []"
          (deleteMessage)="handleDelete($event)"
        ></app-messages-list>
      </div>

      <div class="message-input-bar">
        <p class="text">Mensaje:</p>
        <input
          type="text"
          placeholder="Escribí un mensaje..."
          [(ngModel)]="messageText"
          (keydown.enter)="sendMessage()"
        />

        <button (click)="sendMessage()">Enviar</button>
      </div>
    </ng-container>

    <ng-template #emptyChat>
      <div class="no-chat">Seleccioná un chat</div>
    </ng-template>
  </section>
</div>
