<form class="contact-form" (ngSubmit)="handleSubmit()">
  <h2 class="form-title">Crear nuevo contacto</h2>

  <div class="form-group">
    <label for="name">Nombre:</label>
    <input
      id="name"
      name="name"
      [(ngModel)]="name"
      placeholder="Ingresa el nombre del nuevo contacto"
      required
    />
  </div>

  <div class="form-group">
    <label for="image">URL Imagen:</label>
    <input
      id="image"
      name="image"
      [(ngModel)]="image"
      placeholder="Pegá aquí la URL"
      required
      style="width: 100%"
    />
  </div>

  <button class="btn-blue" type="submit">Crear contacto</button>
</form>
